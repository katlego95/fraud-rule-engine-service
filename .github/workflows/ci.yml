name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The full suite includes Testcontainers integration tests, which need a Docker daemon.
      # Ubuntu runners provide one, so nothing extra is required — but a green build here is the
      # evidence that the tests pass on a machine that is not the author's.
      - name: Build and run the full test suite
        run: ./mvnw -B clean verify
