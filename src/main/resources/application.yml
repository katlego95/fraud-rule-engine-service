spring:
  application:
    name: fraud-rule-engine
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fraud}
    username: ${DATABASE_USERNAME:fraud}
    password: ${DATABASE_PASSWORD:fraud}
    hikari:
      # Fail fast and loudly when the database is unreachable. The default behaviour is to
      # retry until the connection timeout, which reads as a silent hang to anyone running
      # the container without a database.
      initialization-fail-timeout: 10000
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

fraud:
  # Pinned onto every decision so a verdict can be attributed to the code that produced it.
  # In production this would be the git SHA supplied at build time.
  engine-version: ${ENGINE_VERSION:0.1.0}
  privacy:
    # Salts the device and IP hashes. Deterministic hashing over a small input space — IPv4 is
    # only 2^32 — is dictionary-attackable without it, so this is a secret in production and
    # cannot be rotated without invalidating existing hashes. See ADR 0005.
    hash-salt: ${PRIVACY_HASH_SALT:local-development-salt}
  score-bands:
    # Half-open and integral: < 40 approves, 40-69 reviews, >= 70 blocks. Tunable without a
    # redeployment because thresholds move as fraudsters adapt.
    review-from: 40
    block-from: 70

server:
  port: ${SERVER_PORT:8080}

logging:
  structured:
    # Native structured logging in Boot 4.1 — no logback XML and no encoder dependency. The
    # correlation id reaches every line through MDC, which is included as context.
    format:
      console: ${LOG_FORMAT:}
    json:
      context:
        include: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: fraud-rule-engine
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
